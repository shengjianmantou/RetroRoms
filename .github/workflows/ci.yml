name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm run typecheck

  package-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --ignore-scripts
      - run: npm run package:mac -- --output "$RUNNER_TEMP/RetroRoms.app"
      - uses: actions/upload-artifact@v4
        with:
          name: RetroRoms-macos-mvp
          path: ${{ runner.temp }}/RetroRoms.app
