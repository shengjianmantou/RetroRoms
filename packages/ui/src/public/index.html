<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RetroRoms</title><style>
:root{color-scheme:dark;--bg:#09111f;--panel:#101d31;--panel2:#162641;--ink:#e9f1ff;--muted:#91a5c3;--accent:#67d6c0}*{box-sizing:border-box}body{margin:0;font:15px/1.5 ui-sans-serif,system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 0,#19375a 0,transparent 35%),var(--bg)}header{display:flex;justify-content:space-between;align-items:center;padding:24px 36px;border-bottom:1px solid #233451}h1{margin:0;font-size:24px}.eyebrow{color:var(--accent);text-transform:uppercase;font-size:11px;letter-spacing:.16em;font-weight:700}main{max-width:1280px;margin:auto;padding:28px 36px 64px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}input,select,button{border:1px solid #2b4163;border-radius:9px;background:var(--panel);color:var(--ink);padding:10px 12px}input{min-width:280px}button{cursor:pointer;background:var(--accent);color:#06231f;border-color:transparent;font-weight:700}button.secondary{background:var(--panel2);color:var(--ink);border-color:#2b4163}.summary{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);margin:0 0 22px}.summary span{padding:7px 10px;background:#0d192b;border:1px solid #203653;border-radius:999px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.grid.list{grid-template-columns:1fr}.card{position:relative;overflow:hidden;border:1px solid #273c5d;background:linear-gradient(145deg,var(--panel),#0d1828);border-radius:14px;padding:0 0 15px}.grid.list .card{display:grid;grid-template-columns:230px 1fr;min-height:126px;padding:0}.art{height:126px;background:linear-gradient(120deg,#1f8f87,#132a54 50%,#3d2d67);display:flex;align-items:end;padding:14px;font-size:12px;color:#cde7ff}.art.has-artwork{background-size:cover;background-position:center;text-shadow:0 1px 3px #000}.content{padding:13px 15px 0}.grid.list .content{padding:16px 42px 16px 17px}.title{font-size:17px;font-weight:700}.path{margin-top:5px;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chip{padding:3px 7px;border-radius:999px;background:#1a2c48;color:#bcd2ed;font-size:11px}.check{position:absolute;top:12px;right:12px;width:20px;height:20px;accent-color:var(--accent)}.view-toggle{display:inline-flex;gap:2px;padding:3px;border:1px solid #2b4163;border-radius:10px;background:var(--panel)}.view-toggle button{padding:7px 9px;font-size:12px}.view-toggle button.active{background:var(--accent);color:#06231f}.empty{border:1px dashed #345070;border-radius:14px;padding:40px;color:var(--muted);text-align:center}.drawer{position:fixed;right:20px;bottom:20px;max-width:520px;padding:17px;background:#12223a;border:1px solid #35557c;border-radius:14px;box-shadow:0 18px 50px #0008}.drawer[hidden]{display:none}pre{max-height:240px;overflow:auto;font-size:12px;color:#c9d8eb}
</style></head><body><header><div><div class="eyebrow">Local library workspace</div><h1>RetroRoms</h1></div><div id="status">Loading catalog…</div></header><main>
<div class="toolbar"><input id="query" placeholder="Filter titles, paths, CRC…"><select id="language"><option value="">All languages</option><option value="en">English</option><option value="zh">Chinese</option><option value="ja">Japanese</option></select><select id="system"><option value="">All systems</option></select><select id="series"><option value="">All series</option></select><label><input id="preferredOnly" type="checkbox"> Preferred editions only</label><label><input id="overwriteConflicts" type="checkbox"> Overwrite conflicts</label><select id="policy"><option value="auto">Default: Auto</option><option value="compressed">Default: Compressed</option><option value="uncompressed">Default: Uncompressed</option><option value="preserve">Default: Preserve</option></select><span class="view-toggle"><button class="secondary active" id="gridView">Grid</button><button class="secondary" id="listView">List</button></span><button class="secondary" id="selectAll">Select all games</button><button class="secondary" id="selectVisible">Select visible</button><button class="secondary" id="selectPreferred">Select preferred visible</button><button class="secondary" id="clearSelection">Clear selection</button><button class="secondary" id="artworkSettings">Artwork settings</button><button class="secondary" id="scrape">Scrape artwork</button><button id="preview">Preview export</button><button id="export">Run export</button></div>
<div id="systemPolicies" class="chips"></div><div class="summary"><span id="count">0 games</span><span id="selected">0 selected</span><span>Source files stay read-only</span></div><section class="empty"><strong>Quick start</strong><br>Select games, add your TheGamesDB key in Artwork settings, then scrape covers before previewing an export. Source folders are never changed.</section><section id="warnings" class="empty" hidden></section><section id="grid" class="grid"><div class="empty">Loading observations…</div></section></main><aside id="drawer" class="drawer" hidden><strong>Export preview</strong><pre id="plan"></pre><button class="secondary" id="close">Close</button></aside>
<script>
const state={items:[],selected:new Set(),view:'grid',artworkConfigured:false};const $=id=>document.getElementById(id);const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const match=i=>{const q=$('query').value.toLowerCase();return i.title.toLowerCase().includes(q)||i.virtualPath.toLowerCase().includes(q)||i.sha256.includes(q)};function render(){const lang=$('language').value,sys=$('system').value,series=$('series').value,pref=$('preferredOnly').checked,items=state.items.filter(i=>match(i)&&(!lang||i.languages.includes(lang))&&(!sys||i.system===sys)&&(!series||i.seriesKey===series)&&(!pref||i.preferred));$('grid').classList.toggle('list',state.view==='list');$('gridView').classList.toggle('active',state.view==='grid');$('listView').classList.toggle('active',state.view==='list');$('grid').innerHTML=items.length?items.map(i=>`<article class="card"><input class="check" type="checkbox" data-id="${i.id}" ${state.selected.has(i.id)?'checked':''}><div class="art ${i.artwork?'has-artwork':''}" ${i.artwork?`style="background-image:linear-gradient(#0002,#0008),url('${i.artwork}')"`:''}>${esc(i.system.toUpperCase())} · ${esc(i.regions.join(', ')||'Unknown region')}</div><div class="content"><div class="title">${esc(i.title)} ${i.preferred?'<span class="chip">Preferred</span>':''}</div><div class="path" title="${esc(i.virtualPath)}">${esc(i.virtualPath)}</div><div class="chips"><span class="chip">Series: ${esc(i.seriesKey)}</span><span class="chip">${i.identitySource==='dat'?'DAT verified':'Filename match'}</span>${i.languages.map(l=>`<span class="chip">${esc(l)}</span>`).join('')}${i.revision?`<span class="chip">Rev ${esc(i.revision)}</span>`:''}${i.disc?`<span class="chip">Disc ${esc(i.disc)}</span>`:''}</div></div></article>`).join(''):'<div class="empty">No matching games.</div>';document.querySelectorAll('.check').forEach(c=>c.onchange=()=>{c.checked?state.selected.add(c.dataset.id):state.selected.delete(c.dataset.id);$('selected').textContent=`${state.selected.size} selected`});$('count').textContent=`${items.length} games`;$('selected').textContent=`${state.selected.size} selected`}
async function load(){const [d,e,s,scans,warnings,artwork]=await Promise.all(['/api/observations','/api/exports','/api/stats','/api/scans','/api/warnings','/api/artwork/settings'].map(async p=>(await fetch(p)).json()));state.items=d.observations;state.artworkConfigured=artwork.configured;const systems=[...new Set(state.items.map(i=>i.system))].sort();systems.forEach(x=>$('system').insertAdjacentHTML('beforeend',`<option>${esc(x)}</option>`));[...new Set(state.items.map(i=>i.seriesKey))].sort().forEach(x=>$('series').insertAdjacentHTML('beforeend',`<option>${esc(x)}</option>`));$('systemPolicies').innerHTML=systems.map(x=>`<label class="chip">${esc(x)}: <select data-system-policy="${esc(x)}"><option value="">Default</option><option value="compressed">Compressed</option><option value="uncompressed">Uncompressed</option><option value="preserve">Preserve</option></select></label>`).join('');const last=scans.scans[0];$('status').textContent=`${s.observationCount} files · ${s.preferredEditionCount} preferred games · TheGamesDB ${artwork.configured?'ready':'needs key'}${last?` · last scan ${last.status}`:''}`;if(warnings.warnings.length){$('warnings').hidden=false;$('warnings').innerHTML=`<strong>${warnings.warnings.length} scan warnings</strong><br>${warnings.warnings.slice(0,5).map(w=>`<code>${esc(w.code)}</code> ${esc(w.virtualPath)} — ${esc(w.message)}`).join('<br>')}`}render()}
['query','language','system','series','preferredOnly'].forEach(id=>$(id).oninput=render);const visible=()=>[...document.querySelectorAll('.check')].map(c=>state.items.find(i=>i.id===c.dataset.id)).filter(Boolean);$('gridView').onclick=()=>{state.view='grid';render()};$('listView').onclick=()=>{state.view='list';render()};$('selectAll').onclick=()=>{state.items.forEach(i=>state.selected.add(i.id));render()};$('selectVisible').onclick=()=>{visible().forEach(i=>state.selected.add(i.id));render()};$('selectPreferred').onclick=()=>{visible().filter(i=>i.preferred).forEach(i=>state.selected.add(i.id));render()};$('clearSelection').onclick=()=>{state.selected.clear();render()};$('artworkSettings').onclick=async()=>{const key=prompt('Paste your TheGamesDB API key. It is stored only in this processed library on your Mac.');if(!key)return;const r=await fetch('/api/artwork/settings',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({theGamesDbApiKey:key})}),result=await r.json();if(!r.ok){$('status').textContent=`Artwork settings error: ${result.error||'unknown error'}`;return}state.artworkConfigured=true;$('status').textContent='TheGamesDB is ready. Select games and choose Scrape artwork.'};$('scrape').onclick=async()=>{const ids=[...state.selected];if(!ids.length){$('status').textContent='Select games before scraping artwork';return}if(!state.artworkConfigured){$('status').textContent='Add your TheGamesDB API key in Artwork settings before scraping';return}if(!confirm(`Scrape TheGamesDB box art for ${ids.length} selected game${ids.length===1?'':'s'}?`))return;$('status').textContent='Scraping TheGamesDB artwork…';const r=await fetch('/api/artwork/scrape',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ids})}),result=await r.json();if(!r.ok){$('status').textContent=`Artwork scrape error: ${result.error||'unknown error'}`;return}const counts=(result.results||[]).reduce((a,x)=>(a[x.status]=(a[x.status]||0)+1,a),{}),detail=(result.results||[]).find(x=>x.message)?.message;$('status').textContent=`Artwork scrape complete · ${Object.entries(counts).map(([k,v])=>`${v} ${k}`).join(' · ')}${detail?` · ${detail}`:''}`;state.items=(await(await fetch('/api/observations')).json()).observations;render()};const payload=()=>{const profiles={};document.querySelectorAll('[data-system-policy]').forEach(x=>{if(x.value)profiles[x.dataset.system]={outputPolicy:x.value}});return {ids:[...state.selected],policy:$('policy').value,profiles,overwriteConflicts:$('overwriteConflicts').checked}};$('preview').onclick=async()=>{const result=await(await fetch('/api/export-preview',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload())})).json();$('plan').textContent=JSON.stringify(result,null,2);$('drawer').hidden=false};$('export').onclick=async()=>{const p=payload();if(!p.ids.length){$('status').textContent='Select at least one game before exporting';return}if(!confirm(`Export ${p.ids.length} selected games to the processed library?`))return;const result=await(await fetch('/api/export',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(p)})).json();$('plan').textContent=JSON.stringify(result,null,2);$('drawer').hidden=false};$('close').onclick=()=>$('drawer').hidden=true;load().catch(e=>{$('status').textContent='Catalog error';$('grid').innerHTML=`<div class="empty">${esc(e.message)}</div>`});
</script></body></html>
