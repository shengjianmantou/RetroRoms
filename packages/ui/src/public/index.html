<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RetroRoms — Curate your library</title>
  <style>
    :root { color-scheme: dark; --bg:#09111f; --panel:#101d31; --panel2:#162641; --ink:#e9f1ff; --muted:#91a5c3; --accent:#67d6c0; --warn:#f7c66a; }
    * { box-sizing:border-box; } body { margin:0; font:15px/1.5 ui-sans-serif,system-ui,sans-serif; color:var(--ink); background:radial-gradient(circle at 10% 0,#19375a 0,transparent 35%),var(--bg); }
    header { display:flex; justify-content:space-between; align-items:center; padding:24px 36px; border-bottom:1px solid #233451; } h1 { margin:0; font-size:24px; letter-spacing:-.02em; } .eyebrow { color:var(--accent); text-transform:uppercase; font-size:11px; letter-spacing:.16em; font-weight:700; }
    main { max-width:1280px; margin:0 auto; padding:28px 36px 64px; } .toolbar { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:22px; } input,select,button { border:1px solid #2b4163; border-radius:9px; background:var(--panel); color:var(--ink); padding:10px 12px; } input { min-width:280px; } button { cursor:pointer; background:var(--accent); color:#06231f; border-color:transparent; font-weight:700; } button.secondary { background:var(--panel2); color:var(--ink); border-color:#2b4163; }
    .summary { display:flex; gap:10px; flex-wrap:wrap; color:var(--muted); margin:0 0 22px; } .summary span { padding:7px 10px; background:#0d192b; border:1px solid #203653; border-radius:999px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; } .card { position:relative; overflow:hidden; border:1px solid #273c5d; background:linear-gradient(145deg,var(--panel),#0d1828); border-radius:14px; padding:0 0 15px; } .art { height:126px; background:linear-gradient(120deg,#1f8f87,#132a54 50%,#3d2d67); display:flex; align-items:end; padding:14px; font-size:12px; color:#cde7ff; } .content { padding:13px 15px 0; } .title { font-size:17px; font-weight:700; } .path { margin-top:5px; color:var(--muted); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; } .chip { padding:3px 7px; border-radius:999px; background:#1a2c48; color:#bcd2ed; font-size:11px; } .check { position:absolute; top:12px; right:12px; width:20px; height:20px; accent-color:var(--accent); }
    .empty { border:1px dashed #345070; border-radius:14px; padding:40px; color:var(--muted); text-align:center; } .drawer { position:fixed; right:20px; bottom:20px; max-width:520px; padding:17px; background:#12223a; border:1px solid #35557c; border-radius:14px; box-shadow:0 18px 50px #0008; } .drawer[hidden] { display:none; } pre { max-height:240px; overflow:auto; font-size:12px; color:#c9d8eb; }
  </style>
</head>
<body>
  <header><div><div class="eyebrow">Local library workspace</div><h1>RetroRoms</h1></div><div id="status">Loading catalog…</div></header>
  <main>
    <div class="toolbar"><input id="query" placeholder="Filter titles, paths, CRC…"><select id="language"><option value="">All languages</option><option value="en">English</option><option value="zh">Chinese</option><option value="ja">Japanese</option></select><select id="system"><option value="">All systems</option></select><select id="series"><option value="">All series</option></select><label class="toggle"><input id="preferredOnly" type="checkbox"> Preferred editions only</label><label class="toggle"><input id="overwriteConflicts" type="checkbox"> Overwrite conflicts</label><select id="policy"><option value="auto">Default: Auto</option><option value="compressed">Default: Compressed</option><option value="uncompressed">Default: Uncompressed</option><option value="preserve">Default: Preserve</option></select><button id="preview">Preview export</button></div>
    <div id="systemPolicies" class="chips"></div>
    <div class="summary"><span id="count">0 games</span><span id="selected">0 selected</span><span>Source files stay read-only</span></div>
    <section id="warnings" class="empty" hidden></section>
    <section id="grid" class="grid"><div class="empty">Loading observations…</div></section>
  </main>
  <aside id="drawer" class="drawer" hidden><strong>Export preview</strong><pre id="plan"></pre><button class="secondary" id="close">Close</button></aside>
  <script>
    const state={items:[],selected:new Set()}; const $=id=>document.getElementById(id); const escape=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const titleOf=i=>i.title.toLowerCase().includes(($('query').value||'').toLowerCase())||i.virtualPath.toLowerCase().includes(($('query').value||'').toLowerCase())||i.sha256.includes(($('query').value||'').toLowerCase());
    function render(){const lang=$('language').value,sys=$('system').value,series=$('series').value,pref=$('preferredOnly').checked;const items=state.items.filter(i=>titleOf(i)&&(!lang||i.languages.includes(lang))&&(!sys||i.system===sys)&&(!series||i.seriesKey===series)&&(!pref||i.preferred));$('grid').innerHTML=items.length?items.map(i=>`<article class="card"><input class="check" type="checkbox" data-id="${i.id}" ${state.selected.has(i.id)?'checked':''}><div class="art">${i.system.toUpperCase()} · ${i.regions.join(', ')||'Unknown region'}</div><div class="content"><div class="title">${i.title} ${i.preferred?'<span class="chip preferred">Preferred</span>':''}</div><div class="path" title="${i.virtualPath}">${i.virtualPath}</div><div class="chips"><span class="chip">Series: ${i.seriesKey}</span><span class="chip">${i.identitySource==='dat'?'DAT verified':'Filename match'}</span>${i.languages.map(l=>`<span class="chip">${l}</span>`).join('')}${i.revision?`<span class="chip">Rev ${i.revision}</span>`:''}${i.disc?`<span class="chip">Disc ${i.disc}</span>`:''}</div></div></article>`).join(''):'<div class="empty">No matching games.</div>';document.querySelectorAll('.check').forEach(c=>c.onchange=()=>c.checked?state.selected.add(c.dataset.id):state.selected.delete(c.dataset.id));$('count').textContent=`${items.length} games`;$('selected').textContent=`${state.selected.size} selected`;}
    async function load(){const r=await fetch('/api/observations');const d=await r.json();const e=await (await fetch('/api/exports')).json();const s=await (await fetch('/api/stats')).json();const scans=await (await fetch('/api/scans')).json();const warnings=await (await fetch('/api/warnings')).json();state.items=d.observations;const systems=[...new Set(state.items.map(i=>i.system))].sort();systems.forEach(s=>$('system').insertAdjacentHTML('beforeend',`<option>${s}</option>`));[...new Set(state.items.map(i=>i.seriesKey))].sort().forEach(s=>$('series').insertAdjacentHTML('beforeend',`<option>${s}</option>`));$('systemPolicies').innerHTML=systems.map(s=>`<label class="chip">${s}: <select data-system-policy="${s}"><option value="">Default</option><option value="compressed">Compressed</option><option value="uncompressed">Uncompressed</option><option value="preserve">Preserve</option></select></label>`).join('');const last=scans.scans[0];$('status').textContent=`${s.observationCount} files · ${s.preferredEditionCount} preferred games · ${s.verifiedEditionCount} DAT verified · ${e.exports.length} exports${last?` · last scan ${last.status}${last.warningCount?` (${last.warningCount} warnings)`:''}`:''}`;if(warnings.warnings.length){$('warnings').hidden=false;$('warnings').innerHTML=`<strong>${warnings.warnings.length} scan warnings</strong><br>${warnings.warnings.slice(0,5).map(w=>`<code>${escape(w.code)}</code> ${escape(w.virtualPath)} — ${escape(w.message)}`).join('<br>')}`;}render();}
    ['query','language','system','series','preferredOnly'].forEach(id=>$(id).oninput=render);$('preview').onclick=async()=>{const profiles={};document.querySelectorAll('[data-system-policy]').forEach(s=>{if(s.value)profiles[s.dataset.system]={outputPolicy:s.value};});const r=await fetch('/api/export-preview',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ids:[...state.selected],policy:$('policy').value,profiles,overwriteConflicts:$('overwriteConflicts').checked})});const result=await r.json();$('plan').textContent=JSON.stringify(result,null,2);$('status').textContent=`Preview ready · ${result.plan?.length??0} export actions`;$('drawer').hidden=false;};$('close').onclick=()=>$('drawer').hidden=true;load().catch(e=>{$('status').textContent='Catalog error';$('grid').innerHTML=`<div class="empty">${e.message}</div>`});
  </script>
</body>
</html>
